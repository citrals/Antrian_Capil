<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="shieldGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="brickRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="bladeSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Shield Shadow & Border -->
  <path d="M 150 15 
           C 255 15, 275 60, 275 145 
           C 275 230, 215 305, 150 335 
           C 85 305, 25 230, 25 145 
           C 25 60, 45 15, 150 15 Z" 
        fill="url(#shieldGold)" 
        filter="url(#dropGlow)" />

  <!-- Shield Inset Border -->
  <path d="M 150 24 
           C 245 24, 263 65, 263 145 
           C 263 222, 208 293, 150 322 
           C 92 293, 37 222, 37 145 
           C 37 65, 55 24, 150 24 Z" 
        fill="#1E293B" />

  <!-- Shield Green Field -->
  <path d="M 150 30 
           C 238 30, 255 69, 255 145 
           C 255 217, 202 284, 150 312 
           C 98 284, 45 217, 45 145 
           C 45 69, 62 30, 150 30 Z" 
        fill="url(#shieldGreen)" />

  <!-- Sun Rays / Light Effect in upper part -->
  <circle cx="150" cy="72" r="42" fill="#FDE047" opacity="0.15" />

  <!-- Cirebon Gateway (Candi Bentar / Gapura Keraton Merah Bata) -->
  <g id="gapura">
    <!-- Left Pillar -->
    <path d="M 98 205 L 120 205 L 120 120 L 112 120 L 112 110 L 120 110 L 114 95 L 105 105 L 105 140 L 98 140 Z" fill="url(#brickRed)" stroke="#7F1D1D" stroke-width="1.2"/>
    <rect x="94" y="202" width="30" height="6" fill="#78350F" rx="1"/>
    <!-- Right Pillar -->
    <path d="M 202 205 L 180 205 L 180 120 L 188 120 L 188 110 L 180 110 L 186 95 L 195 105 L 195 140 L 202 140 Z" fill="url(#brickRed)" stroke="#7F1D1D" stroke-width="1.2"/>
    <rect x="176" y="202" width="30" height="6" fill="#78350F" rx="1"/>
    <!-- Brick pattern lines -->
    <line x1="102" y1="130" x2="118" y2="130" stroke="#FECACA" stroke-width="0.8" opacity="0.6"/>
    <line x1="100" y1="150" x2="118" y2="150" stroke="#FECACA" stroke-width="0.8" opacity="0.6"/>
    <line x1="100" y1="170" x2="118" y2="170" stroke="#FECACA" stroke-width="0.8" opacity="0.6"/>
    <line x1="182" y1="130" x2="198" y2="130" stroke="#FECACA" stroke-width="0.8" opacity="0.6"/>
    <line x1="182" y1="150" x2="200" y2="150" stroke="#FECACA" stroke-width="0.8" opacity="0.6"/>
    <line x1="182" y1="170" x2="200" y2="170" stroke="#FECACA" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Golden 5-Pointed Star (Ketuhanan Yang Maha Esa) -->
  <g id="bintang" filter="url(#dropGlow)">
    <polygon points="150,42 154,54 167,54 157,62 161,74 150,66 139,74 143,62 133,54 146,54" 
             fill="url(#starGold)" stroke="#B45309" stroke-width="1"/>
  </g>

  <!-- Keris Cirebon Pusaka & Tombak Bersilang -->
  <g id="senjata">
    <!-- Center Tombak / Kujang Pole -->
    <line x1="150" y1="80" x2="150" y2="225" stroke="#78350F" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 150 72 L 155 86 L 145 86 Z" fill="url(#starGold)" stroke="#B45309" stroke-width="1"/>

    <!-- Wavy Keris Blade (Center Foreground) -->
    <path d="M 148 95 
             Q 154 110, 147 125 
             Q 155 140, 147 155 
             Q 155 170, 148 185 
             L 152 185 
             Q 159 170, 151 155 
             Q 159 140, 151 125 
             Q 158 110, 150 95 Z" 
          fill="url(#bladeSilver)" stroke="#475569" stroke-width="0.8"/>
    <!-- Keris Hilt / Gagang -->
    <path d="M 146 186 L 154 186 L 155 198 Q 150 204, 144 200 Z" fill="#92400E" stroke="#451A03" stroke-width="1"/>
  </g>

  <!-- Padi (Kanan) & Kapas (Kiri) - Simbol Kemakmuran -->
  <g id="padi_kapas">
    <!-- Kapas (Kiri - Putih & Daun Kelopak Hijau) -->
    <g fill="#F8FAFC" stroke="#166534" stroke-width="1">
      <circle cx="68" cy="118" r="7"/>
      <circle cx="62" cy="138" r="7.5"/>
      <circle cx="59" cy="160" r="8"/>
      <circle cx="61" cy="184" r="8"/>
      <circle cx="69" cy="207" r="8"/>
      <circle cx="82" cy="228" r="7.5"/>
    </g>
    <!-- Daun kelopak kapas -->
    <g fill="#22C55E">
      <polygon points="68,112 65,116 71,116"/>
      <polygon points="62,132 58,136 65,136"/>
      <polygon points="59,154 54,158 62,158"/>
      <polygon points="61,178 56,182 64,182"/>
      <polygon points="69,201 64,205 72,205"/>
    </g>

    <!-- Padi (Kanan - Butir Emas) -->
    <g fill="url(#starGold)" stroke="#B45309" stroke-width="0.8">
      <ellipse cx="232" cy="116" rx="4" ry="7" transform="rotate(30 232 116)"/>
      <ellipse cx="238" cy="135" rx="4.5" ry="7.5" transform="rotate(25 238 135)"/>
      <ellipse cx="241" cy="156" rx="4.5" ry="8" transform="rotate(15 241 156)"/>
      <ellipse cx="239" cy="178" rx="4.5" ry="8" transform="rotate(-5 239 178)"/>
      <ellipse cx="231" cy="200" rx="4.5" ry="8" transform="rotate(-20 231 200)"/>
      <ellipse cx="218" cy="220" rx="4.5" ry="7.5" transform="rotate(-35 218 220)"/>
      <ellipse cx="201" cy="236" rx="4" ry="7" transform="rotate(-50 201 236)"/>
    </g>
    <!-- Tangkai melengkung -->
    <path d="M 68 118 Q 50 170, 95 240" fill="none" stroke="#15803D" stroke-width="2.2"/>
    <path d="M 232 116 Q 250 170, 205 240" fill="none" stroke="#CA8A04" stroke-width="2.2"/>
  </g>

  <!-- Bottom Golden Ribbon Banner -->
  <g id="pita_semboyan" filter="url(#dropGlow)">
    <!-- Ribbon back folds -->
    <polygon points="35,272 55,255 55,282" fill="#92400E"/>
    <polygon points="265,272 245,255 245,282" fill="#92400E"/>

    <!-- Main Ribbon Banner Curve -->
    <path d="M 45 272 
             C 90 252, 210 252, 255 272 
             L 248 296 
             C 205 276, 95 276, 52 296 Z" 
          fill="url(#starGold)" 
          stroke="#B45309" 
          stroke-width="1.5" />

    <!-- Ribbon Swallowtail ends -->
    <polygon points="45,272 20,262 38,285 20,305 52,296" fill="#FBBF24" stroke="#B45309" stroke-width="1.2"/>
    <polygon points="255,272 280,262 262,285 280,305 248,296" fill="#FBBF24" stroke="#B45309" stroke-width="1.2"/>

    <!-- Motto Text: RAME ING GAWE SUCI ING PAMRIH -->
    <text x="150" y="282" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="900" 
          letter-spacing="1.2" 
          fill="#1E293B" 
          text-anchor="middle">
      RAME ING GAWE SUCI ING PAMRIH
    </text>
  </g>

  <!-- Region Label (Header bottom) -->
  <text x="150" y="324" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="9" 
        font-weight="800" 
        letter-spacing="1.5" 
        fill="#FDE047" 
        text-anchor="middle">
    KABUPATEN CIREBON
  </text>
</svg>
